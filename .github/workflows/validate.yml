name: Validate Mavi candidate
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to validate when called by the release workflow.
        required: false
        type: string
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q portable app Setup-Models.py Update-Mavi.py
      - name: Document runtime
        run: python -m pip install -r portable/requirements.txt
      - name: Workspace and tool tests
        run: python -m unittest discover -s tests -v
      - name: Update archive tests
        run: python test_update.py -v
      - name: Frontend syntax
        run: node --check portable/web/app.js
      - name: Release source hygiene
        run: python scripts/check_release.py
      - name: Parse Windows installer without running it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path 'Install-Mavi.ps1').Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Install-Mavi.ps1 has PowerShell syntax errors.'
          }
          Write-Host 'Install-Mavi.ps1 parsed successfully; installer was not executed.'
# This workflow does not publish artifacts or releases. Passing mocks do not
# establish Windows GPU, actual desktop-control, microphone or Discord readiness.
